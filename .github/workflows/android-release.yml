name: K1pL4y Agent Release APK

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Verify and build release-test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Run unit tests (required)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android lint (required)
        run: ./gradlew --no-daemon lintDebug

      - name: Build release variant (test signing only)
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload release-test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: K1pL4y_Agent-pro-release-test
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish prerelease APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-test-build-${{ github.run_number }}
          name: K1pL4y_Agent.pro Test Build #${{ github.run_number }}
          body: |
            Automated test build for K1pL4y_Agent.pro.

            **Test build only:** signed with the Android debug signing key. Not for production or Play Store use.
            Unit tests and Android lint must pass before this prerelease is published.
          prerelease: true
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
