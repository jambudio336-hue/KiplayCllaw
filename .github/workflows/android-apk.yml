name: K1pL4y Agent Android APK

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test, lint, and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check Gradle wrapper
        run: ./gradlew --version

      - name: Scan for legacy package identifiers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'com[./]cellclaw|CellClaw|cellclaw' app/src app/*.gradle.kts settings.gradle.kts; then
            echo "Legacy package identifier found; review matches before building."
            exit 1
          fi

      - name: Run unit tests (required)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run Android lint (required)
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: K1pL4y_Agent-pro-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
